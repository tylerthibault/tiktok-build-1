services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rideplanner
      POSTGRES_PASSWORD: rideplanner
      POSTGRES_DB: rideplanner
    ports:
      - "5432:5432"
    volumes:
      - rideplanner_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideplanner -d rideplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rideplanner_postgres:
